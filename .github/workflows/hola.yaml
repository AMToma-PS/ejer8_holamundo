name: Ejecutar hola.java

on:
	push:
		branches:
			- main

jobs:
	ejecutar:
		runs-on: ubuntu-latest
		steps:
			- name: Obtener código
				uses: actions/checkout@v4
			- name: Configurar Java
				uses: actions/setup-java@v4
				with:
					distribution: temurin
					java-version: '17'
			- name: Ejecutar hola.java
				run: java src/hola.java
