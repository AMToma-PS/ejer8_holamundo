name: Ejecutar hola.java

on:
  push:
    branches:
      - main

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v5
      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Ejecutar hola.java
        run: |
          javac -d out src/hola.java
          java -cp out src.hola
